{% load i18n %}

{% if cv_subscribe.feedPageUrl %}
  <a href="{{ cv_subscribe.feedPageUrl }}">{% translate "Feeds" %}</a>
{% elif cv_subscribe.blogRssUrl %}
  <a href="{{ cv_subscribe.blogRssUrl }}">{% translate "RSS feed" %}</a>
{% endif %}
{% for link in cv_subscribe.followLinks %}
  <a href="{{ link.url }}"{% if link.rel %} rel="{{ link.rel }}"{% endif %}>{{ link.label }}</a>
{% endfor %}
